publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = 'com.ajsoftware.scaffold'
            artifactId = 'scaffolding'
            version = '1.0.0'
            
            pom {
                name = 'AJSoftware Scaffolding Plugin'
                description = 'Spring Modulith scaffolding plugin for hexagonal architecture'
                url = 'https://github.com/SteverWiw/scaffolding'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                
                developers {
                    developer {
                        id = 'ajsoftware'
                        name = 'AJSoftware Team'
                        email = 'dev@ajsoftware.com'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/SteverWiw/scaffolding.git'
                    developerConnection = 'scm:git:ssh://github.com/SteverWiw/scaffolding.git'
                    url = 'https://github.com/SteverWiw/scaffolding'
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/SteverWiw/scaffolding"
            credentials {
                username = System.getenv("GITHUB_USERNAME") ?: project.findProperty("gpr.user")
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key")
            }
        }
        
        mavenLocal()
    }
}