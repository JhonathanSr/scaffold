plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '1.2.1'
}

group = 'io.github.steverwi'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
}

// Evitar duplicados en processResources
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

gradlePlugin {
    website = 'https://github.com/SteverWiw/scaffolding'
    vcsUrl = 'https://github.com/SteverWiw/scaffolding.git'
    
    plugins {
        scaffoldMain {
            id = 'io.github.steverwi.scaffold'
            displayName = 'AJSoftware Spring Modulith Scaffolding'
            description = 'Generate Spring Modulith projects with hexagonal architecture and domain-driven design'
            tags = ['spring', 'modulith', 'hexagonal', 'architecture', 'scaffolding', 'ddd']
            implementationClass = 'com.ajsoftware.scaffold.ScaffoldingPlugin'
        }
    }
}

apply from: 'publish.gradle'