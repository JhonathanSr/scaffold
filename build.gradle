plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'com.ajsoftware.scaffold'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
}

gradlePlugin {
    plugins {
        scaffoldMain {
            id = 'com.ajsoftware.scaffold'
            implementationClass = 'com.ajsoftware.scaffold.ScaffoldingPlugin'
        }
        scaffoldProject {
            id = 'com.ajsoftware.scaffold.project'
            implementationClass = 'com.ajsoftware.scaffold.project.ProjectPlugin'
        }
        scaffoldModule {
            id = 'com.ajsoftware.scaffold.module'
            implementationClass = 'com.ajsoftware.scaffold.module.ModulePlugin'
        }
        scaffoldDelete {
            id = 'com.ajsoftware.scaffold.delete'
            implementationClass = 'com.ajsoftware.scaffold.delete.DeletePlugin'
        }
        scaffoldComponent {
            id = 'com.ajsoftware.scaffold.component'
            implementationClass = 'com.ajsoftware.scaffold.component.ComponentPlugin'
        }
    }
}

apply from: 'publish.gradle'